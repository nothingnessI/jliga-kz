
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: jliga
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:1234@db:5432/jliga-kz
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # ВАЖНО: Сохраняем загруженные картинки на реальном диске, чтобы они не пропадали
      - ./app/static/uploads:/app/app/static/uploads

volumes:
  postgres_data: