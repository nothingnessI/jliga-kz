{% extends "admin_base.html" %}

{% block admin_content %}
<!-- ШАПКА -->
<div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center mb-4 gap-3">
    <h4 class="fw-bold m-0">{{ 'Редактировать игрока' if player else 'Новый игрок' }}</h4>
    <a href="/admin/players" class="btn btn-outline-secondary d-inline-flex align-items-center justify-content-center">
        <i class="bi bi-arrow-left me-1"></i> Назад
    </a>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body p-3 p-md-4">
        <form action="/admin/players/{% if player %}{{ player.id }}/edit{% else %}create{% endif %}" method="post" enctype="multipart/form-data">

            <div class="row g-3">
                <!-- ФАМИЛИЯ И ИМЯ -->
                <div class="col-12 col-md-6">
                    <label class="form-label text-muted small fw-bold text-uppercase">Фамилия *</label>
                    <input type="text" name="last_name" class="form-control" value="{{ player.last_name if player else '' }}" required>
                </div>

                <div class="col-12 col-md-6">
                    <label class="form-label text-muted small fw-bold text-uppercase">Имя *</label>
                    <input type="text" name="first_name" class="form-control" value="{{ player.first_name if player else '' }}" required>
                </div>

                <!-- ДАТА И АМПЛУА -->
                <div class="col-12 col-md-6">
                    <label class="form-label text-muted small fw-bold text-uppercase">Дата рождения</label>
                    <input type="date" name="date_of_birth" class="form-control" value="{{ player.date_of_birth.strftime('%Y-%m-%d') if player and player.date_of_birth else '' }}">
                </div>

                <div class="col-12 col-md-6">
                    <label class="form-label text-muted small fw-bold text-uppercase">Амплуа</label>
                    <select name="position" class="form-select">
                        <option value="">Не указано</option>
                        {% for pos in positions %}
                            <option value="{{ pos.value }}" {% if player and player.position == pos %}selected{% endif %}>
                                {{ pos.value|capitalize }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- ФОТОГРАФИЯ -->
                <div class="col-12 mt-4">
                    <label class="form-label text-muted small fw-bold text-uppercase">Фотография игрока</label>
                    <input type="file" name="photo" class="form-control" accept="image/*">

                    {% if player and player.photo_url %}
                        <div class="d-flex align-items-center gap-2 mt-2">
                            <span class="text-muted small">Текущее фото:</span>
                            <a href="{{ player.photo_url }}" target="_blank" class="badge bg-success text-decoration-none">
                                <i class="bi bi-eye me-1"></i> Посмотреть
                            </a>
                        </div>
                    {% endif %}
                </div>
            </div>

            <!-- КНОПКИ СОХРАНЕНИЯ (Адаптивные) -->
            <div class="mt-4 pt-4 border-top d-flex flex-column flex-sm-row gap-2">
                <button type="submit" class="btn btn-success btn-lg fw-bold px-4 w-100 w-sm-auto">
                    <i class="bi bi-check-lg me-1"></i> Сохранить
                </button>
                <a href="/admin/players" class="btn btn-light btn-lg px-4 w-100 w-sm-auto border">Отмена</a>
            </div>
        </form>
    </div>
</div>

<style>
    /* Фикс для iOS Safari: убирает автозум и делает поля крупнее для пальцев */
    .form-control, .form-select {
        font-size: 16px !important;
        padding: 12px 15px; /* Увеличенные отступы внутри полей */
    }

    /* Кнопки на ПК не растягиваем на всю ширину */
    @media (min-width: 576px) {
        .w-sm-auto { width: auto !important; }
    }
</style>
{% endblock %}
