{% extends "base.html" %}

{% block content %}
<div class="container py-3 py-md-5">

    <!-- ШАПКА -->
    <div class="mb-3 mb-md-4 border-bottom pb-2">
        <h3 class="text-uppercase fw-bold m-0" style="color: #0f2537;">Партнеры</h3>
    </div>

    <!-- СЕТКА ПАРТНЕРОВ -->
    <div class="row g-2 g-md-4 mt-1 mt-md-3">

        <!-- Цикл по партнерам из базы данных -->
        {% for p in partners %}
        <div class="col-6 col-md-4 col-lg-3">
            <a href="{{ p.url or '#' }}" target="_blank" rel="noopener noreferrer" class="text-decoration-none text-dark d-block h-100">
                <div class="card border-0 shadow-sm h-100 hover-lift partner-card">

                    <!-- Логотип -->
                    <div class="d-flex align-items-center justify-content-center p-2 p-md-4 partner-logo-box">
                        <img src="{{ p.logo_url }}" class="img-fluid" alt="{{ p.name }}" style="max-height: 100%; max-width: 100%; object-fit: contain;">
                    </div>

                    <!-- Название -->
                    <div class="card-body pt-2 pt-md-0 px-3 pb-3 border-top border-light">
                        <p class="card-text fw-bold text-uppercase mb-0 text-truncate text-center text-md-start" style="font-size: 13px;" title="{{ p.name }}">
                            {{ p.name }}
                        </p>
                    </div>
                </div>
            </a>
        </div>
        {% endfor %}

        <!-- Место для рекламы (КЛИКАБЕЛЬНО) - всегда в конце -->
        <div class="col-6 col-md-4 col-lg-3">
            <a href="https://wa.clck.bar/77087232313" target="_blank" rel="noopener noreferrer" class="text-decoration-none text-dark d-block h-100">
                <div class="card border-0 shadow-sm h-100 hover-lift partner-card" style="border: 1px dashed #adb5bd !important;">

                    <!-- Логотип (заглушка) -->
                    <div class="d-flex align-items-center justify-content-center p-2 p-md-4 partner-logo-box">
                        <img src="/static/Partners/void.jpg" class="img-fluid" alt="Место для вашей рекламы" style="max-height: 100%; max-width: 100%; object-fit: contain;">
                    </div>

                    <!-- Название -->
                    <div class="card-body pt-2 pt-md-0 px-3 pb-3 border-top border-light bg-light bg-opacity-50">
                        <p class="card-text fw-bold text-uppercase mb-0 text-truncate text-center text-md-start" style="font-size: 12px; color: #0d6efd;">
                            Место для вашей рекламы
                        </p>
                    </div>
                </div>
            </a>
        </div>

    </div>
</div>

<style>
    /* Высота блока с логотипом */
    .partner-logo-box {
        height: 110px; /* Компактно для телефонов */
    }

    /* Фикс для iOS (отключаем залипание ховер-эффекта при скролле) */
    @media (max-width: 767.98px) {
        .hover-lift:hover {
            transform: none !important;
            box-shadow: 0 .125rem .25rem rgba(0,0,0,.075)!important;
        }
    }

    /* Настройки для ПК */
    @media (min-width: 768px) {
        .partner-logo-box {
            height: 150px; /* Больше пространства для лого на ПК */
        }
    }
</style>
{% endblock %}
