{% extends "base.html" %}

{% block content %}
<div class="mb-4 border-bottom pb-2">
    <h3 class="text-uppercase fw-bold m-0">Партнеры</h3>
</div>

<div class="row mt-4">
    <!-- 1. Казахстанская лига -->
    <div class="col-6 col-md-4 col-lg-3 mb-4">
        <div class="card border-0 shadow-sm h-100">
            <div class="d-flex align-items-center justify-content-center p-4" style="height: 180px;">
                <img src="/static/Partners/kazakhstan_liga.jpg" class="img-fluid" alt="Қазақстан футбол лигасы" style="max-height: 100%; object-fit: contain;">
            </div>
            <div class="card-body pt-0">
                <p class="card-text fw-bold text-uppercase mb-0" style="font-size: 14px;">Қазақстан футбол лигасы</p>
            </div>
        </div>
    </div>

    <!-- 2. КФФ -->
    <div class="col-6 col-md-4 col-lg-3 mb-4">
        <div class="card border-0 shadow-sm h-100">
            <div class="d-flex align-items-center justify-content-center p-4" style="height: 180px;">
                <img src="/static/Partners/kff.jpg" class="img-fluid" alt="КФФ" style="max-height: 100%; object-fit: contain;">
            </div>
            <div class="card-body pt-0">
                <p class="card-text fw-bold text-uppercase mb-0" style="font-size: 14px;">Қазақстан Футбол Федерациясы</p>
            </div>
        </div>
    </div>

    <!-- 3. J-LIGA -->
    <div class="col-6 col-md-4 col-lg-3 mb-4">
        <div class="card border-0 shadow-sm h-100">
            <div class="d-flex align-items-center justify-content-center p-4" style="height: 180px;">
                <img src="/static/Partners/jliga.png" class="img-fluid" alt="J-LIGA" style="max-height: 100%; object-fit: contain;">
            </div>
            <div class="card-body pt-0">
                <p class="card-text fw-bold text-uppercase mb-0" style="font-size: 14px;">J-LIGA</p>
            </div>
        </div>
    </div>

    <!-- 4. Алматы Футбол -->
    <div class="col-6 col-md-4 col-lg-3 mb-4">
        <div class="card border-0 shadow-sm h-100">
            <div class="d-flex align-items-center justify-content-center p-4" style="height: 180px;">
                <img src="/static/Partners/almaty_football.jpg" class="img-fluid" alt="Алматы Футбол" style="max-height: 100%; object-fit: contain;">
            </div>
            <div class="card-body pt-0">
                <p class="card-text fw-bold text-uppercase mb-0" style="font-size: 14px;">Алматы Футбол Федерациясы</p>
            </div>
        </div>
    </div>

    <!-- 5. Место для рекламы (КЛИКАБЕЛЬНО) -->
    <div class="col-6 col-md-4 col-lg-3 mb-4">
        <!-- Обернули карточку в ссылку на WhatsApp -->
        <a href="https://wa.clck.bar/77087232313" target="_blank" rel="noopener noreferrer" class="text-decoration-none text-dark d-block h-100">
            <div class="card border-0 shadow-sm h-100 hover-lift">
                <div class="d-flex align-items-center justify-content-center p-4" style="height: 180px;">
                    <img src="/static/Partners/void.jpg" class="img-fluid" alt="Место для вашей рекламы" style="max-height: 100%; object-fit: contain;">
                </div>
                <div class="card-body pt-0">
                    <p class="card-text fw-bold text-uppercase mb-0" style="font-size: 14px;">Место для вашей рекламы</p>
                </div>
            </div>
        </a>
    </div>
</div>
{% endblock %}
