{% extends "base.html" %}

{% block content %}
<div class="mb-4 border-bottom pb-2">
    <h3 class="text-uppercase fw-bold m-0">Партнеры</h3>
</div>

<div class="row mt-4">

    <!-- Цикл по партнерам из базы данных -->
    {% for p in partners %}
    <div class="col-6 col-md-4 col-lg-3 mb-4">
        <a href="{{ p.url or '#' }}" target="_blank" rel="noopener noreferrer" class="text-decoration-none text-dark d-block h-100">
            <div class="card border-0 shadow-sm h-100 hover-lift">
                <div class="d-flex align-items-center justify-content-center p-4" style="height: 180px;">
                    <img src="{{ p.logo_url }}" class="img-fluid" alt="{{ p.name }}" style="max-height: 100%; object-fit: contain;">
                </div>
                <div class="card-body pt-0">
                    <p class="card-text fw-bold text-uppercase mb-0" style="font-size: 14px;">{{ p.name }}</p>
                </div>
            </div>
        </a>
    </div>
    {% endfor %}

    <!-- Место для рекламы (КЛИКАБЕЛЬНО) - всегда в конце -->
    <div class="col-6 col-md-4 col-lg-3 mb-4">
        <a href="https://wa.clck.bar/77087232313" target="_blank" rel="noopener noreferrer" class="text-decoration-none text-dark d-block h-100">
            <div class="card border-0 shadow-sm h-100 hover-lift">
                <div class="d-flex align-items-center justify-content-center p-4" style="height: 180px;">
                    <img src="/static/Partners/void.jpg" class="img-fluid" alt="Место для вашей рекламы" style="max-height: 100%; object-fit: contain;">
                </div>
                <div class="card-body pt-0">
                    <p class="card-text fw-bold text-uppercase mb-0" style="font-size: 14px;">Место для вашей рекламы</p>
                </div>
            </div>
        </a>
    </div>

</div>
{% endblock %}
