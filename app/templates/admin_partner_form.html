{% extends "admin_base.html" %}

{% block admin_content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold m-0">{% if partner %}Редактировать партнера{% else %}Новый партнер{% endif %}</h4>
    <a href="/admin/partners" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Назад</a>
</div>

<div class="card border-0 shadow-sm" style="max-width: 800px;">
    <div class="card-body p-4">
        <form method="post" enctype="multipart/form-data">
            <div class="row g-3">
                <div class="col-md-12">
                    <label class="form-label fw-bold">Название (для админки)</label>
                    <input type="text" name="name" class="form-control" value="{{ partner.name if partner else '' }}" required>
                </div>

                <div class="col-md-12">
                    <label class="form-label fw-bold">Ссылка (URL)</label>
                    <input type="url" name="url" class="form-control" value="{{ partner.url if partner else '' }}" placeholder="https://...">
                </div>

                <div class="col-md-12">
                    <label class="form-label fw-bold">Логотип (изображение)</label>
                    {% if partner and partner.logo_url %}
                        <div class="mb-2"><img src="{{ partner.logo_url }}" style="max-height: 60px;"></div>
                    {% endif %}
                    <input type="file" name="logo" class="form-control" accept="image/*" {% if not partner %}required{% endif %}>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold">Порядок сортировки</label>
                    <input type="number" name="sort_order" class="form-control" value="{{ partner.sort_order if partner else 0 }}">
                    <div class="form-text">Чем меньше число, тем левее стоит логотип.</div>
                </div>

                <div class="col-md-6 d-flex align-items-end pb-2">
                    <div class="form-check form-switch fs-5">
                        <input class="form-check-input" type="checkbox" name="is_active" id="is_active" {% if partner and partner.is_active %}checked{% else %}checked{% endif %}>
                        <label class="form-check-label fs-6 mt-1" for="is_active">Показывать на сайте</label>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary fw-bold mt-4 px-4">Сохранить</button>
        </form>
    </div>
</div>
{% endblock %}
