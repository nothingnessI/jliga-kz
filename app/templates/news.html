{% extends "base.html" %}
{% block content %}
<h3 class="text-uppercase fw-bold mb-4 border-bottom pb-2">Новости</h3>
<div class="row">
    {% for news in news_list %}
    <div class="col-md-6 col-xl-4 mb-4">
        <div class="card border-0 shadow-sm h-100 hover-lift">
            <div class="card-body p-4">
                <small class="text-muted fw-bold">{{ news.published_at.strftime('%d %B %Y') if news.published_at else '' }}</small>
                <h5 class="card-title fw-bold mt-2">{{ news.title }}</h5>
                <p class="card-text text-muted mt-3">{{ news.content[:150] }}...</p>
                <a href="#" class="btn btn-sm btn-outline-dark mt-2">Читать далее</a>
            </div>
        </div>
    </div>
    {% else %}
    <div class="col-12"><div class="alert alert-secondary">Новостей пока нет.</div></div>
    {% endfor %}
</div>
{% endblock %}
