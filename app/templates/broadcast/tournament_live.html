
<!DOCTYPE html>
<html lang="ru" class="jliga-standalone">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>J-LIGA · LIVE</title>

<style>
:root {
    color-scheme: dark;
    --bg: #101522;
    --card: #202842;
    --accent: #c9f12d;
    --text: #f8f8f8;
    --muted: #aeb6c8;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px system-ui, Arial, sans-serif;
}

main {
    max-width: 1160px;
    margin: auto;
    padding: 25px;
}

h1 {
    margin: 0;
    font-size: 25px;
}

.subtitle {
    color: var(--muted);
    margin: 8px 0 25px;
}

#matches {
    display: grid;
    grid-template-columns:
        repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
}

.match {
    display: block;
    text-decoration: none;
    background: var(--card);
    color: white;
    border-radius: 9px;
    padding: 17px;
    border: 1px solid #344361;
}

.match:hover {
    border-color: var(--accent);
}

.badge {
    font-size: 12px;
    font-weight: 800;
    color: #ffb0b0;
    margin-bottom: 12px;
}

.teams {
    font-size: 17px;
    font-weight: 800;
    line-height: 1.5;
}

.score {
    font-size: 38px;
    font-weight: 900;
    color: var(--accent);
    margin-top: 14px;
}

.phase {
    font-size: 12px;
    margin-top: 8px;
    color: var(--muted);
}

.empty {
    padding: 20px;
    background: var(--card);
    border-radius: 8px;
    color: var(--muted);
}

#error {
    color: #ffabab;
    margin-top: 15px;
}
</style>
    <link rel="stylesheet" href="/static/css/jliga-responsive.css" data-jliga-responsive>
</head>

<body>

<main>

    <h1 id="title">
        ● J-LIGA LIVE
    </h1>

    <div class="subtitle">
        Текущие результаты матчей турнира.
        Обновление каждые 2,5 секунды.
    </div>

    <div id="matches">
        <div class="empty">
            Загрузка матчей...
        </div>
    </div>

    <div id="error"></div>

</main>

<script>
"use strict";

const TOURNAMENT_ID = Number(
    {{ tournament_id | tojson }}
);

const API =
    `/api/v1/broadcast/tournaments/${TOURNAMENT_ID}/live`;

const $ = id => document.getElementById(id);

let loading = false;


function createElement(tag, className, value) {
    const element = document.createElement(tag);

    if (className) {
        element.className = className;
    }

    if (value !== undefined) {
        element.textContent = String(value);
    }

    return element;
}


function render(matches) {
    const root = $("matches");

    root.replaceChildren();

    if (!matches.length) {
        root.append(
            createElement(
                "div",
                "empty",
                "Сейчас нет матчей в прямом эфире"
            )
        );

        return;
    }

    for (const match of matches) {
        const element = createElement(
            match.broadcast_id ? "a" : "div",
            "match"
        );

        if (match.broadcast_id) {
            element.href =
                `/broadcast/overlay/${match.broadcast_id}`;
        }

        element.append(
            createElement(
                "div",
                "badge",
                "● LIVE"
            )
        );

        element.append(
            createElement(
                "div",
                "teams",
                `${match.home} — ${match.away}`
            )
        );

        element.append(
            createElement(
                "div",
                "score",
                `${match.home_score ?? 0} : ${match.away_score ?? 0}`
            )
        );

        element.append(
            createElement(
                "div",
                "phase",
                match.phase || match.status || ""
            )
        );

        root.append(element);
    }
}


async function refresh() {
    if (loading || document.hidden) {
        return;
    }

    loading = true;

    try {
        const response = await fetch(API, {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const data = await response.json();

        $("title").textContent =
            `● ${data.tournament || "J-LIGA"} · LIVE`;

        render(data.matches || []);

        $("error").textContent = "";

    } catch (error) {
        $("error").textContent =
            `Ошибка обновления: ${error.message}`;

    } finally {
        loading = false;
    }
}


refresh();

setInterval(
    refresh,
    2500
);

document.addEventListener(
    "visibilitychange",
    () => {
        if (!document.hidden) {
            refresh();
        }
    }
);
</script>

    <script src="/static/js/jliga-responsive.js" defer data-jliga-responsive></script>
</body>
</html>
