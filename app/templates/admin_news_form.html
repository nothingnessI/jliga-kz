{% extends "admin_base.html" %}

{% block admin_content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold m-0">{{ 'Редактировать новость' if news else 'Новая новость' }}</h4>
    <a href="/admin/news" class="btn btn-outline-secondary">← Назад</a>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body p-4">
        <form action="{% if news %}/admin/news/{{ news.id }}/edit{% else %}/admin/news/create{% endif %}" method="post" enctype="multipart/form-data">
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label text-muted small fw-bold text-uppercase">Заголовок *</label>
                    <input type="text" name="title" class="form-control" value="{{ news.title if news else '' }}" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label text-muted small fw-bold text-uppercase">Slug (URL) *</label>
                    <input type="text" name="slug" class="form-control" value="{{ news.slug if news else '' }}" required>
                </div>

                <div class="col-12">
                    <label class="form-label text-muted small fw-bold text-uppercase">Контент (HTML) *</label>
                    <textarea name="content" class="form-control font-monospace" rows="12" required placeholder="<p>Текст новости...</p>">{{ news.content if news else '' }}</textarea>
                </div>

                <div class="col-md-6">
                    <label class="form-label text-muted small fw-bold text-uppercase">Обложка новости</label>
                    <input type="file" name="image" class="form-control" accept="image/*">
                </div>

                <div class="col-md-6">
                    <label class="form-label text-muted small fw-bold text-uppercase">Дата публикации</label>
                    <input type="datetime-local" name="published_at" class="form-control" value="{{ news.published_at.strftime('%Y-%m-%dT%H:%M') if news and news.published_at else '' }}">
                </div>

                <!-- ПРИВЯЗКА К ТУРНИРУ -->
                <div class="col-md-6 mt-4">
                    <label class="form-label text-muted small fw-bold text-uppercase">Турнир</label>
                    <select name="tournament_id" class="form-select">
                        <option value="">Без турнира</option>
                        {% for t in tournaments %}
                            <option value="{{ t.id }}" {% if news and news.tournament_id == t.id %}selected{% endif %}>{{ t.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- ПРИВЯЗКА К КОМАНДАМ (Мультиселект) -->
                <div class="col-md-6 mt-4">
                    <label class="form-label text-muted small fw-bold text-uppercase">Команды</label>
                    <select name="team_ids" class="form-select" multiple size="6">
                        {% for team in teams %}
                            <option value="{{ team.id }}" {% if team.id in selected_team_ids %}selected{% endif %}>{{ team.name }}</option>
                        {% endfor %}
                    </select>
                    <small class="text-muted">Удерживайте <b>Ctrl</b> (Windows) или <b>Cmd</b> (Mac), чтобы выбрать несколько.</small>
                </div>

                <div class="col-12 mt-3">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" name="is_published" id="is_published" value="true" {% if news and news.is_published %}checked{% endif %}>
                        <label class="form-check-label fw-bold text-muted" for="is_published">Опубликовать на сайте</label>
                    </div>
                </div>
            </div>

            <div class="mt-4 pt-3 border-top">
                <button type="submit" class="btn btn-success fw-bold px-4">Сохранить новость</button>
                <a href="/admin/news" class="btn btn-light ms-2">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
