{% extends "admin_base.html" %}

{% block admin_content %}
<!-- ШАПКА -->
<div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center mb-4 gap-3">
    <h4 class="fw-bold m-0">
        {{ 'Редактировать стадион' if stadium else 'Новый стадион' }}
    </h4>
    <a href="/admin/stadiums" class="btn btn-outline-secondary d-inline-flex align-items-center justify-content-center">
        <i class="bi bi-arrow-left me-1"></i> Назад к списку
    </a>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body p-3 p-md-4">
        <form action="/admin/stadiums/{% if stadium %}{{ stadium.id }}/edit{% else %}create{% endif %}" method="post">

            <div class="row g-3">
                <!-- НАЗВАНИЕ И ГОРОД -->
                <div class="col-12 col-md-6">
                    <label class="form-label text-muted small fw-bold text-uppercase">Название *</label>
                    <input type="text" name="name" class="form-control" value="{{ stadium.name if stadium else '' }}" required>
                </div>

                <div class="col-12 col-md-6">
                    <label class="form-label text-muted small fw-bold text-uppercase">Город</label>
                    <input type="text" name="city" class="form-control" value="{{ stadium.city if stadium and stadium.city else '' }}">
                </div>

                <!-- АДРЕС -->
                <div class="col-12">
                    <label class="form-label text-muted small fw-bold text-uppercase">Адрес</label>
                    <input type="text" name="address" class="form-control" value="{{ stadium.address if stadium and stadium.address else '' }}">
                </div>

                <!-- ВМЕСТИМОСТЬ И ФОТО -->
                <div class="col-12 col-md-4">
                    <label class="form-label text-muted small fw-bold text-uppercase">Вместимость</label>
                    <input type="number" name="capacity" class="form-control" inputmode="numeric" value="{{ stadium.capacity if stadium and stadium.capacity else '' }}">
                </div>

                <div class="col-12 col-md-8">
                    <label class="form-label text-muted small fw-bold text-uppercase">Ссылка на фото (URL)</label>
                    <input type="text" name="image_url" class="form-control" value="{{ stadium.image_url if stadium and stadium.image_url else '' }}">
                </div>

                <!-- КООРДИНАТЫ -->
                <div class="col-12 col-md-6">
                    <label class="form-label text-muted small fw-bold text-uppercase">Широта (Latitude)</label>
                    <input type="number" step="any" name="latitude" class="form-control" inputmode="decimal" value="{{ stadium.latitude if stadium and stadium.latitude else '' }}">
                </div>

                <div class="col-12 col-md-6">
                    <label class="form-label text-muted small fw-bold text-uppercase">Долгота (Longitude)</label>
                    <input type="number" step="any" name="longitude" class="form-control" inputmode="decimal" value="{{ stadium.longitude if stadium and stadium.longitude else '' }}">
                </div>
            </div>

            <!-- КНОПКИ СОХРАНЕНИЯ (Адаптивные) -->
            <div class="mt-4 pt-4 border-top d-flex flex-column flex-sm-row gap-2">
                <button type="submit" class="btn btn-success btn-lg fw-bold px-4 w-100 w-sm-auto">
                    <i class="bi bi-check-lg me-1"></i> Сохранить
                </button>
                <a href="/admin/stadiums" class="btn btn-light btn-lg px-4 w-100 w-sm-auto border">Отмена</a>
            </div>
        </form>
    </div>
</div>

<style>
    /* Фикс для iOS Safari: убирает автозум и делает поля крупнее для пальцев */
    .form-control, .form-select {
        font-size: 16px !important;
        padding: 12px 15px;
    }

    /* Кнопки на ПК не растягиваем на всю ширину */
    @media (min-width: 576px) {
        .w-sm-auto { width: auto !important; }
    }
</style>
{% endblock %}
