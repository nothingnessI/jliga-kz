{% extends "admin_base.html" %}

{% block admin_content %}
<!-- ШАПКА -->
<div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center mb-4 gap-3">
    <h4 class="fw-bold m-0">Выдать дисквалификацию</h4>
    <a href="/admin/disqualifications" class="btn btn-outline-secondary d-inline-flex align-items-center justify-content-center">
        <i class="bi bi-arrow-left me-1"></i> Назад
    </a>
</div>

<div class="card border-0 shadow-sm mx-auto" style="max-width: 800px; width: 100%;">
    <div class="card-body p-3 p-md-4">
        <form method="post" action="/admin/disqualifications/create">
            <div class="row g-3">

                <!-- ТУРНИР -->
                <div class="col-12">
                    <label class="form-label fw-bold">Турнир *</label>
                    <select name="tournament_id" class="form-select" required>
                        <option value="">— выберите турнир —</option>
                        {% for t in tournaments %}
                            <option value="{{ t.id }}">{{ t.name }} ({{ t.season }})</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- КОМАНДА -->
                <div class="col-12">
                    <label class="form-label fw-bold">Команда *</label>
                    <select name="team_id" class="form-select" required>
                        <option value="">— выберите команду —</option>
                        {% for t in teams %}
                            <option value="{{ t.id }}">{{ t.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- ИГРОК -->
                <div class="col-12">
                    <label class="form-label fw-bold">Игрок *</label>
                    <select name="player_id" class="form-select" required>
                        <option value="">— выберите игрока —</option>
                        {% for p in players %}
                            <option value="{{ p.id }}">{{ p.last_name }} {{ p.first_name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- КОЛИЧЕСТВО МАТЧЕЙ -->
                <div class="col-12 col-md-6 mt-4">
                    <label class="form-label fw-bold">На сколько матчей *</label>
                    <input type="number" name="matches_total" class="form-control" min="1" value="1" inputmode="numeric" required>
                    <div class="form-text">Игрок пропустит указанное количество матчей.</div>
                </div>

                <!-- ПРИЧИНА -->
                <div class="col-12 col-md-6 mt-4">
                    <label class="form-label fw-bold">Причина *</label>
                    <input type="text" name="reason" class="form-control" required placeholder="Например: Красная карточка, 4 ЖК...">
                </div>
            </div>

            <!-- КНОПКИ СОХРАНЕНИЯ -->
            <div class="mt-5 pt-4 border-top d-flex flex-column flex-sm-row gap-2">
                <button type="submit" class="btn btn-primary btn-lg fw-bold px-4 w-100 w-sm-auto shadow-sm">
                    <i class="bi bi-check-lg me-1"></i> Выдать
                </button>
                <a href="/admin/disqualifications" class="btn btn-light btn-lg px-4 w-100 w-sm-auto border">Отмена</a>
            </div>
        </form>
    </div>
</div>

<style>
    /* Фикс для iOS Safari: убирает автозум и делает поля крупнее для пальцев */
    .form-control, .form-select {
        font-size: 16px !important;
        padding: 12px 15px;
    }

    /* Кнопки на ПК не растягиваем на всю ширину */
    @media (min-width: 576px) {
        .w-sm-auto { width: auto !important; }
    }
</style>
{% endblock %}
