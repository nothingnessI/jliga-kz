{% extends "admin_base.html" %}

{% block admin_content %}
<div class="container py-4">
    <h3 class="mb-4">Добавить дисквалификацию</h3>

    <form method="post" action="/admin/disqualifications/create" class="card p-4 shadow-sm">

        <div class="mb-3">
            <label class="form-label fw-bold">Турнир</label>
            <select name="tournament_id" class="form-select" required>
                {% for t in tournaments %}
                    <option value="{{ t.id }}">{{ t.name }} ({{ t.season }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Команда</label>
            <select name="team_id" class="form-select" required>
                {% for t in teams %}
                    <option value="{{ t.id }}">{{ t.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Игрок</label>
            <select name="player_id" class="form-select" required>
                {% for p in players %}
                    <option value="{{ p.id }}">{{ p.last_name }} {{ p.first_name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Матчей дисквалификации</label>
            <input type="number" name="matches_total" class="form-control" min="1" value="1" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Причина</label>
            <textarea name="reason" class="form-control" rows="3" required></textarea>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Создать</button>
            <a href="/admin/disqualifications" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
