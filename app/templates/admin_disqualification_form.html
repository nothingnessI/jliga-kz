{% extends "admin_base.html" %}

{% block admin_content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold m-0">Выдать дисквалификацию</h4>
    <a href="/admin/disqualifications" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Назад</a>
</div>

<div class="card border-0 shadow-sm" style="max-width: 800px;">
    <div class="card-body p-4">
        <form method="post" action="/admin/disqualifications/create">
            <div class="row g-3">
                <div class="col-md-12">
                    <label class="form-label fw-bold">Турнир</label>
                    <select name="tournament_id" class="form-select" required>
                        <option value="">— выберите турнир —</option>
                        {% for t in tournaments %}
                            <option value="{{ t.id }}">{{ t.name }} ({{ t.season }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-12">
                    <label class="form-label fw-bold">Команда</label>
                    <select name="team_id" class="form-select" required>
                        <option value="">— выберите команду —</option>
                        {% for t in teams %}
                            <option value="{{ t.id }}">{{ t.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-12">
                    <label class="form-label fw-bold">Игрок</label>
                    <select name="player_id" class="form-select" required>
                        <option value="">— выберите игрока —</option>
                        {% for p in players %}
                            <option value="{{ p.id }}">{{ p.last_name }} {{ p.first_name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold">На сколько матчей</label>
                    <input type="number" name="matches_total" class="form-control" min="1" value="1" required>
                    <div class="form-text">Игрок пропустит указанное количество матчей.</div>
                </div>

                <div class="col-md-12">
                    <label class="form-label fw-bold">Причина</label>
                    <input type="text" name="reason" class="form-control" required placeholder="Например: Красная карточка, 4 желтые, неспортивное поведение...">
                </div>
            </div>

            <button type="submit" class="btn btn-primary fw-bold mt-4 px-4">Выдать</button>
        </form>
    </div>
</div>
{% endblock %}
