{% extends "admin_base.html" %}

{% block admin_content %}
<!-- ШАПКА -->
<div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
    <h4 class="fw-bold m-0">Регламент: {{ tournament.name }}</h4>
    <a href="/admin/tournaments/{{ tournament.id }}/edit" class="btn btn-outline-secondary d-inline-flex align-items-center justify-content-center">
        <i class="bi bi-arrow-left me-1"></i> Назад
    </a>
</div>

<form method="post" action="/admin/tournaments/{{ tournament.id }}/regulations">
    <div class="row g-4">
        <!-- ЛЕВАЯ КОЛОНКА -->
        <div class="col-12 col-lg-6">

            <!-- ФОРМАТ И ОЧКИ -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-white fw-bold border-bottom">Формат и очки</div>
                <div class="card-body p-3 p-md-4">
                    <div class="mb-4">
                        <label class="form-label fw-bold mb-3">Формат группового этапа</label>
                        <div class="form-check mb-2 p-3 bg-light rounded border">
                            <input class="form-check-input ms-0 me-2 fs-5" type="radio" name="allow_draws" value="true" id="draws_yes" {% if tournament.allow_draws %}checked{% endif %}>
                            <label class="form-check-label fw-bold ms-4 mt-1" for="draws_yes">Ничьи возможны</label>
                        </div>
                        <div class="form-check p-3 bg-light rounded border">
                            <input class="form-check-input ms-0 me-2 fs-5" type="radio" name="allow_draws" value="false" id="draws_no" {% if not tournament.allow_draws %}checked{% endif %}>
                            <label class="form-check-label fw-bold ms-4 mt-1" for="draws_no">До победы (без ничьих)</label>
                        </div>
                    </div>

                    <hr>

                    <div class="row g-3 text-center">
                        <div class="col-12 col-sm-4">
                            <label class="form-label small fw-bold text-muted text-uppercase mb-1">За победу</label>
                            <input type="number" name="points_win" class="form-control form-control-lg text-center fw-bold" inputmode="numeric" value="{{ tournament.points_win }}">
                        </div>
                        <div class="col-12 col-sm-4">
                            <label class="form-label small fw-bold text-muted text-uppercase mb-1">За ничью</label>
                            <input type="number" name="points_draw" class="form-control form-control-lg text-center fw-bold" inputmode="numeric" value="{{ tournament.points_draw }}">
                        </div>
                        <div class="col-12 col-sm-4">
                            <label class="form-label small fw-bold text-muted text-uppercase mb-1">За поражение</label>
                            <input type="number" name="points_loss" class="form-control form-control-lg text-center fw-bold" inputmode="numeric" value="{{ tournament.points_loss }}">
                        </div>
                    </div>
                </div>
            </div>

            <!-- ВРЕМЯ МАТЧА -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-white fw-bold border-bottom">Время матча</div>
                <div class="card-body p-3 p-md-4">
                    <div class="row g-3">
                        <div class="col-12 col-sm-6">
                            <label class="form-label small fw-bold text-muted">Кол-во периодов (таймов)</label>
                            <input type="number" name="periods_count" class="form-control" inputmode="numeric" value="{{ tournament.periods_count }}">
                        </div>
                        <div class="col-12 col-sm-6">
                            <label class="form-label small fw-bold text-muted">Длительность (мин)</label>
                            <input type="number" name="period_duration" class="form-control" inputmode="numeric" value="{{ tournament.period_duration }}">
                        </div>
                    </div>
                </div>
            </div>

            <!-- ДИСКВАЛИФИКАЦИИ -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-white fw-bold border-bottom">Дисквалификации</div>
                <div class="card-body p-3 p-md-4">
                    <div class="form-check form-switch p-3 bg-light rounded border mb-4">
                        <input class="form-check-input ms-0 me-2 fs-5" type="checkbox" name="auto_disqualifications" id="auto_disq" {% if tournament.auto_disqualifications %}checked{% endif %}>
                        <label class="form-check-label fw-bold ms-4 mt-1 text-danger" for="auto_disq">Автоматические дисквалификации</label>
                    </div>

                    <div class="row g-3 text-center">
                        <div class="col-12 col-sm-4">
                            <label class="form-label small fw-bold text-muted mb-1">ЖК до бана</label>
                            <input type="number" name="yellow_cards_limit" class="form-control text-center" inputmode="numeric" value="{{ tournament.yellow_cards_limit }}">
                        </div>
                        <div class="col-12 col-sm-4">
                            <label class="form-label small fw-bold text-muted mb-1">Пропуск за ЖК</label>
                            <input type="number" name="yellow_suspension" class="form-control text-center" inputmode="numeric" value="{{ tournament.yellow_suspension }}">
                        </div>
                        <div class="col-12 col-sm-4">
                            <label class="form-label small fw-bold text-muted mb-1">Пропуск за КК</label>
                            <input type="number" name="red_suspension" class="form-control text-center" inputmode="numeric" value="{{ tournament.red_suspension }}">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ПРАВАЯ КОЛОНКА -->
        <div class="col-12 col-lg-6">

            <!-- ДОПОЛНИТЕЛЬНО -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-white fw-bold border-bottom">Дополнительно</div>
                <div class="card-body p-3 p-md-4">
                    <div class="form-check form-switch p-3 bg-light rounded border mb-4">
                        <input class="form-check-input ms-0 me-2 fs-5" type="checkbox" name="tech_loss_goals" id="tech_loss" {% if tournament.tech_loss_goals %}checked{% endif %}>
                        <label class="form-check-label fw-bold ms-4 mt-1" for="tech_loss">Учёт голов при техническом поражении</label>
                    </div>

                    <div class="row g-3">
                        <div class="col-12 col-sm-6">
                            <label class="form-label small fw-bold text-muted">Макс. игроков в основе</label>
                            <input type="number" name="max_starting_players" class="form-control" inputmode="numeric" value="{{ tournament.max_starting_players }}">
                        </div>
                        <div class="col-12 col-sm-6">
                            <label class="form-label small fw-bold text-muted">Макс. игроков на замене</label>
                            <input type="number" name="max_bench_players" class="form-control" inputmode="numeric" value="{{ tournament.max_bench_players }}">
                        </div>
                    </div>
                </div>
            </div>

            <!-- РАНЖИРОВАНИЕ (Drag and Drop) -->
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white fw-bold border-bottom">Ранжирование при равенстве очков</div>
                <div class="card-body p-3 p-md-4">
                    <input type="hidden" name="tie_breakers" id="tie_breakers_input" value='{{ tournament.tie_breakers | tojson if tournament.tie_breakers else "[]" }}'>

                    <div class="alert alert-info py-2 px-3 small border-info shadow-sm mb-3">
                        <i class="bi bi-info-circle me-1"></i> Зажмите иконку <i class="bi bi-grip-vertical"></i> и потяните, чтобы изменить приоритет правил.
                    </div>

                    <ul id="tie-breaker-list" class="list-group mb-3">
                        <!-- Список генерируется JS -->
                    </ul>

                    <div class="d-flex flex-column flex-sm-row gap-2">
                        <select id="available-tie-breakers" class="form-select" style="font-size: 16px;">
                            <option value="h2h_points">Очки в личных встречах</option>
                            <option value="h2h_wins">Победы в личных встречах</option>
                            <option value="h2h_goal_diff">Разница мячей в личных встречах</option>
                            <option value="goal_diff">Общая разница мячей</option>
                            <option value="h2h_goals_for">Забитые мячи в личных встречах</option>
                            <option value="wins">Количество побед</option>
                            <option value="goals_for">Общее количество забитых мячей</option>
                        </select>
                        <button type="button" class="btn btn-primary fw-bold px-4" onclick="addTieBreaker()">Добавить</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- КНОПКА СОХРАНЕНИЯ -->
    <div class="mt-4 pt-3 border-top d-flex justify-content-end">
        <button type="submit" class="btn btn-success btn-lg px-5 fw-bold w-100 w-sm-auto shadow">
            <i class="bi bi-save me-2"></i> Сохранить регламент
        </button>
    </div>
</form>

<style>
    /* Фикс iOS Safari и увеличение кликабельных зон */
    .form-control, .form-select {
        font-size: 16px !important;
        padding: 10px 12px;
    }

    .form-control-lg {
        font-size: 20px !important;
    }

    @media (min-width: 576px) {
        .w-sm-auto { width: auto !important; }
    }

    /* Стили для Drag-and-Drop элементов */
    .sortable-ghost {
        opacity: 0.4;
        background-color: #e9ecef !important;
        border: 2px dashed #0d6efd !important;
    }
</style>

<!-- Подключаем SortableJS -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
<script>
    const allRules = {
        "h2h_points": "Очки в личных встречах",
        "h2h_wins": "Победы в личных встречах",
        "h2h_goal_diff": "Разница мячей в личных встречах",
        "goal_diff": "Общая разница мячей",
        "h2h_goals_for": "Забитые мячи в личных встречах",
        "wins": "Количество побед",
        "goals_for": "Общее количество забитых мячей"
    };

    let currentRules = JSON.parse(document.getElementById('tie_breakers_input').value || "[]");

    function renderRules() {
        const list = document.getElementById('tie-breaker-list');
        list.innerHTML = '';

        if (currentRules.length === 0) {
            list.innerHTML = '<li class="list-group-item text-muted text-center py-3">Правила не добавлены<br><small>(По умолчанию: Очки -> Разница мячей -> Забитые)</small></li>';
        }

        currentRules.forEach((rule, index) => {
            const li = document.createElement('li');
            li.className = 'list-group-item d-flex justify-content-between align-items-center bg-white mb-2 border shadow-sm rounded';
            li.dataset.id = rule;
            li.innerHTML = `
                <div class="d-flex align-items-center gap-3 w-100" style="min-width: 0;">
                    <i class="bi bi-grip-vertical fs-4 text-muted drag-handle" style="cursor: grab; touch-action: none;"></i>
                    <span class="fw-bold text-dark text-truncate" style="font-size: 14px;">${index + 1}. ${allRules[rule] || rule}</span>
                </div>
                <button type="button" class="btn btn-sm btn-outline-danger flex-shrink-0" onclick="removeRule('${rule}')"><i class="bi bi-x-lg"></i></button>
            `;
            list.appendChild(li);
        });

        document.getElementById('tie_breakers_input').value = JSON.stringify(currentRules);
    }

    function addTieBreaker() {
        const select = document.getElementById('available-tie-breakers');
        const val = select.value;
        if (!currentRules.includes(val)) {
            currentRules.push(val);
            renderRules();
        }
    }

    function removeRule(rule) {
        currentRules = currentRules.filter(r => r !== rule);
        renderRules();
    }

    // Инициализация Drag-and-Drop
    new Sortable(document.getElementById('tie-breaker-list'), {
        animation: 150,
        handle: '.drag-handle', // Тянем только за иконку
        ghostClass: 'sortable-ghost',
        onEnd: function (evt) {
            const newOrder = [];
            document.querySelectorAll('#tie-breaker-list li').forEach(li => {
                // ИСПРАВЛЕНО: было newRules.push, теперь newOrder.push
                if (li.dataset.id) newOrder.push(li.dataset.id);
            });
            currentRules = newOrder;
            document.getElementById('tie_breakers_input').value = JSON.stringify(currentRules);

            // Перерисовываем, чтобы обновить нумерацию (1, 2, 3...)
            renderRules();
        }
    });

    // Первичный рендер
    renderRules();
</script>
{% endblock %}
