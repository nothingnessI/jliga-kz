{% extends "admin_base.html" %}

{% block admin_content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold m-0">Медиа-альбомы</h4>
    <a href="/admin/media/create" class="btn btn-primary fw-bold">
        <i class="bi bi-plus-lg"></i> Создать альбом
    </a>
</div>

<div class="row">
    {% for album in albums %}
    <div class="col-md-4 mb-4">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
                <h5 class="fw-bold text-dark">{{ album.title }}</h5>
                <p class="text-muted small mb-3">Фотографий: {{ album.items|length }}</p>
                <div class="d-flex justify-content-between align-items-center">
                    <a href="/admin/media/{{ album.id }}" class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-folder2-open me-1"></i> Открыть
                    </a>
                    <form action="/admin/media/{{ album.id }}/delete" method="post" onsubmit="return confirm('Удалить альбом и все фото?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    {% else %}
    <div class="col-12">
        <div class="alert alert-light text-center py-5 text-muted border">
            Альбомов пока нет.
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
