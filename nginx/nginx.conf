events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Максимальный размер загружаемых файлов (для картинок)
    client_max_body_size 10M;

    # Сжатие для скорости
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Защита от DDOS на уровне Nginx
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # =========================================================================
    # 1. БЛОК HTTP: Только перенаправление на HTTPS
    # =========================================================================
    server {
        listen 80;
        server_name jliga.kz www.jliga.kz;

        # Все запросы на 80-й порт перенаправляем на 443-й (HTTPS)
        return 301 https://$host$request_uri;
    }

    # =========================================================================
    # 2. БЛОК HTTPS: Основная работа сайта
    # =========================================================================
    server {
        listen 443 ssl http2;
        server_name jliga.kz www.jliga.kz;

        # --- ПУТИ К СЕРТИФИКАТАМ ---
        # Убедись, что файлы fullchain.pem и privkey.pem лежат в папке nginx/ssl/ на сервере
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # --- НАСТРОЙКИ БЕЗОПАСНОСТИ SSL ---
        ssl_protocols TLSv1.2 TLSv1.3; # Отключаем устаревшие протоколы
        ssl_ciphers HIGH:!aNULL:!MD5;  # Только надежные шифры
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # --- ЗАГОЛОВКИ БЕЗОПАСНОСТИ ---
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # HSTS (говорит браузеру всегда использовать только HTTPS для этого домена)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # --- ОБСЛУЖИВАНИЕ ЗАПРОСОВ ---

        # Статика — напрямую через Nginx (быстрее)
        location /static/ {
            alias /var/www/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Логин — особый лимит (защита от брутфорса)
        location = /web-login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme; # Важно для куки (secure=True)
        }

        # Всё остальное — на Python (FastAPI)
        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s; # Для AI-генерации карточек
        }
    }
}