events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Максимальный размер загружаемых файлов (для картинок)
    client_max_body_size 10M;

    # Сжатие для скорости
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Защита от DDOS на уровне Nginx
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # Перенаправление HTTP -> HTTPS (раскомментируй, когда получишь SSL)
    # server {
    #     listen 80;
    #     server_name jliga.kz www.jliga.kz;
    #     return 301 https://$host$request_uri;
    # }

    server {
        listen 80;
        server_name jliga.kz www.jliga.kz; # Замени на свой домен

        # Безопасные заголовки
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Статика — напрямую через Nginx (быстрее)
        location /static/ {
            alias /var/www/static/; # <--- ПРАВИЛЬНЫЙ ПУТЬ
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Логин — особый лимит
        location = /web-login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Всё остальное — на Python
        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s; # Для AI-генерации карточек
        }
    }
}